<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triagem de Frete</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      padding-top: 60px;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      width: 340px;
    }
    h1 {
      font-size: 20px;
      margin-top: 0;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    #resultado {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      background: #eef2ff;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Simulador de Frete</h1>
    <label for="valor">Valor do pedido (R$):</label>
    <input id="valor" type="number" step="0.01" placeholder="Ex: 150.00" />
    <button onclick="consultarFrete()">Calcular Frete</button>
    <div id="resultado">Digite um valor e clique em calcular.</div>
  </div>

  <script>
    async function consultarFrete() {
      const valor = document.getElementById("valor").value;
      const box = document.getElementById("resultado");

      if (!valor) {
        box.textContent = "Informe um valor antes de consultar.";
        return;
      }

      const resposta = await fetch(`/frete?valor=${encodeURIComponent(valor)}`);
      const dados = await resposta.json();

      if (!resposta.ok) {
        box.textContent = dados.erro || "Erro ao consultar.";
        return;
      }

      box.textContent = dados.freteGratis
        ? `Pedido de R$ ${dados.valorPedido}: FRETE GRÁTIS!`
        : `Pedido de R$ ${dados.valorPedido}: Frete de R$ ${dados.valorFrete}.`;
    }
  </script>
</body>
</html>
